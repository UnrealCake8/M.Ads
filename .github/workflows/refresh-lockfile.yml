name: Refresh lockfile

on:
  push:
    branches:
      - feat/google-login

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-login
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove workflow
        run: |
          rm .github/workflows/refresh-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-lockfile.yml
          git commit -m "chore: refresh lockfile for Firebase auth"
          git push origin HEAD:feat/google-login
